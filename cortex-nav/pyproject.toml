[project]
name = "cortex-nav"
version = "0.1.0"
description = "Reduced navigation engine: an agent's action space as the edges of a Merkle-anchored tool-call graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # The one reward function for the repo lives in xibalba_cortex.ais_trajectory_reward.
  "xibalba-cortex",
  "eth-abi>=5.0",
  "eth-utils>=5.0",
  "eth-hash[pycryptodome]>=0.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_nav"]

[tool.hatch.metadata]
allow-direct-references = true

# Standalone on purpose: this package is not a member of the root project, is absent from
# the root pyproject.toml and root uv.lock, and the pilot image never installs it.
[tool.uv.sources]
xibalba-cortex = { path = "../", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
