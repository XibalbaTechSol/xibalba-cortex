[project]
name = "xibalba-cortex"
version = "0.1.0"
description = "Local provenance-aware graph memory MCP server for Hermes Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0.0",
  "eth-hash[pycryptodome]>=0.7.0",
  "sqlite-vec>=0.1.9",
  "pyyaml>=6.0",
  # `[connector]` (docs/EXECUTION_PLAN.md A2/A3): Cortex's own `agent_identity.resolve_agent_identities`
  # import needs `requests`, which is not in the dependency-light SDK core -- explicitly requesting
  # the extra is what lets the SDK drop it (and the rest of the connector stack) from its own base
  # `dependencies`. Cortex's `normalize_hook`/`crypto.merkle` imports are already core-safe.
  "integrity-sdk[connector]",
  "uvicorn>=0.30",
  "sentence-transformers>=5.7.0",
  "pyjwt[crypto]>=2.13.0",
  "requests>=2.34.2",
  "protobuf>=5.0.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.35.0",
  "opentelemetry-sdk>=1.35.0",
  "opentelemetry-proto>=1.35.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.35.0",
  "grpcio>=1.70.0",
]

[project.scripts]
xibalba-cortex-hosted-connector = "xibalba_cortex.hosted_connector:main"
xibalba-cortex-observer = "xibalba_cortex.observer_capture:main"
xibalba-cortex-observer-install = "xibalba_cortex.observer_install:main"
xibalba-cortex = "xibalba_cortex.server:main"
xibalba-cortex-raw-ingest = "xibalba_cortex.raw_body_ingest:main"
xibalba-cortex-otlp-receiver = "xibalba_cortex.otlp_receiver:main"
xibalba-cortex-otlp-grpc-receiver = "xibalba_cortex.otlp_grpc_receiver:main"
xibalba-cortex-transcript-ingest = "xibalba_cortex.transcript_ingest:main"
xibalba-cortex-session-sync = "xibalba_cortex.session_sync:main"
xibalba-cortex-codex-mcp-backfill = "xibalba_cortex.codex_mcp_backfill:main"
xibalba-cortex-session-open = "xibalba_cortex.session_open:main"
xibalba-cortex-wiki-ingest = "xibalba_cortex.wiki_ingest:main"
xibalba-cortex-demo-seed = "xibalba_cortex.demo_seed:main"
xibalba-cortex-embedding-worker = "xibalba_cortex.embedding_worker:main"
xibalba-cortex-para-worker = "xibalba_cortex.para_worker:main"
xibalba-cortex-contradiction-worker = "xibalba_cortex.contradiction_worker:main"
xibalba-cortex-inference-daemon = "xibalba_cortex.inference_loop:main"
xibalba-cortex-operator = "xibalba_cortex.operator:main"
xibalba-cortex-ingest-tokens = "xibalba_cortex.ingest_tokens:main"
xibalba-cortex-tenant-onboard = "xibalba_cortex.tenant_onboarding:main"
xibalba-cortex-tenant-validate = "xibalba_cortex.tenant_validation:main"
xibalba-cortex-tenant-inference-validate = "xibalba_cortex.tenant_inference_validation:main"
xibalba-cortex-hermes-watermark-status = "xibalba_cortex.hermes_watermark:main"
xibalba-cortex-integrity-outbox-consumer = "xibalba_cortex.integrity_sdk_outbox_consumer:main"
xibalba-cortex-sync-core-registrations = "xibalba_cortex.core_registration_sync:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xibalba_cortex"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/viewer/node_modules",
  "/viewer/dist",
  "/viewer/test-results",
  "/test-results",
  "/*.png",
]

[tool.uv.sources]
integrity-sdk = { path = "../integrity-core/integrity-sdk", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
