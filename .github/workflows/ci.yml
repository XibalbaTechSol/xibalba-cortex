name: CI

# Mirrors integrity-core's own ci.yml sdk/cli jobs (same uv-based Python toolchain), the one
# other CI workflow in this ecosystem. `uv sync` needs integrity-sdk, which pyproject.toml/
# uv.lock pin via a local sibling-repo path (`../integrity-core/integrity-sdk`) rather than a
# published package — see PACKAGING.md / the packaging note in README.md for why. Both repos
# are checked out below as siblings inside GITHUB_WORKSPACE. actions/checkout rejects paths
# outside GITHUB_WORKSPACE, so do not use `../integrity-core` as a checkout destination.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.x"

jobs:
  test:
    name: xibalba-cortex (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xibalba-cortex
    steps:
      - name: Checkout xibalba-cortex
        uses: actions/checkout@v4
        with:
          path: xibalba-cortex
          persist-credentials: false
      - name: Checkout integrity-core (sibling repo, integrity-sdk path dependency)
        uses: actions/checkout@v4
        with:
          repository: XibalbaTechSol/integrity-core
          # Keep the local path dependency deterministic; update deliberately when SDK changes are needed.
          # integrity-core main after #160 merged (2026-10-05) -- bumped because #36's
          # store.py/scripts/decision_trace_e2e.py import integrity_sdk.core.decision_trace,
          # added by integrity-core#160's A7 SDK work. #36 merged via this repo's auto-merge
          # before this bump landed, so main's CI has been broken since; this is the
          # immediate fix, not new feature work.
          ref: e5f301b2804595160d1e51fbe3cebe40ae910584
          path: integrity-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Fail with an explicit layout error before uv reports an opaque missing-distribution failure.
      - run: test -f ../integrity-core/integrity-sdk/pyproject.toml
      - run: uv sync --extra otel
      - run: uv run pytest -q
