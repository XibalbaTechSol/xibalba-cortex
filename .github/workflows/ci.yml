name: CI

# Mirrors integrity-core's own ci.yml sdk/cli jobs (same uv-based Python toolchain), the one
# other CI workflow in this ecosystem. `uv sync` needs integrity-sdk, which pyproject.toml/
# uv.lock pin via a local sibling-repo path (`../integrity-core/integrity-sdk`) rather than a
# published package — see PACKAGING.md / the packaging note in README.md for why. Both repos
# are checked out below as siblings inside GITHUB_WORKSPACE. actions/checkout rejects paths
# outside GITHUB_WORKSPACE, so do not use `../integrity-core` as a checkout destination.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.x"

jobs:
  test:
    name: xibalba-cortex (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xibalba-cortex
    steps:
      - name: Checkout xibalba-cortex
        uses: actions/checkout@v4
        with:
          path: xibalba-cortex
          persist-credentials: false
      - name: Checkout integrity-core (sibling repo, integrity-sdk path dependency)
        uses: actions/checkout@v4
        with:
          repository: XibalbaTechSol/integrity-core
          # integrity-core main after #162 merged (2026-10-06). Bumped off the previous
          # #160 pin because that pin predates integrity-core#161, an integrity_sdk.did
          # migration fix (state-only identity destinations) that this repo's identity
          # resolution depends on; the bump also carries #162's additive
          # integrity_sdk.hook_runner module. Bump this ref deliberately, in the SAME PR
          # as any code that imports a newly added SDK symbol -- never in a follow-up.
          # Landing the two out of order is what broke main's CI on 2026-10-05 in both
          # this repo and its sibling; see the A0 precondition in integrity-core's
          # docs/EXECUTION_PLAN.md.
          ref: 4ddaae1965635224958e147f6eaaead06e3cdc41
          path: integrity-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Fail with an explicit layout error before uv reports an opaque missing-distribution failure.
      - run: test -f ../integrity-core/integrity-sdk/pyproject.toml
      - run: uv sync --extra otel
      - run: uv run pytest -q
