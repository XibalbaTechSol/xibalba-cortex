<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super-Cortex Neural Clipper</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0e1526;
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 255, 204, 0.3);
      --cyan: #00ffcc;
      --violet: #a855f7;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(14, 21, 38, 0.9);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 11px;
      color: #000;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom: 2px solid var(--cyan);
      background: rgba(0, 255, 204, 0.04);
    }

    main {
      padding: 14px 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
      font-family: var(--font-sans);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > div {
      flex: 1;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #00ffcc, #00b4d8);
      color: #050b14;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 12px;
      border: none;
      border-radius: 6px;
      padding: 9px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      width: 100%;
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 7px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.25);
    }

    .preview-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 255, 204, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.2);
      color: var(--cyan);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-alert {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      margin-top: 10px;
      display: none;
    }

    .result-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .result-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Recall tab styles */
    .search-result-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .search-result-item .meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .search-result-item .text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.3;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">⚡</div>
      <div class="brand-title">SUPER-CORTEX</div>
    </div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">CONNECTING...</span>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-clip">CLIP</button>
    <button class="tab-btn" id="tab-recall">RECALL</button>
    <button class="tab-btn" id="tab-settings">SETTINGS</button>
  </div>

  <main>
    <!-- CLIP TAB -->
    <div id="view-clip">
      <div class="preview-badge" id="preview-badge">
        <span>PARSER: <strong id="detected-class">DETECTING...</strong></span>
        <span id="detected-triples">0 TRIPLES</span>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="clip-scope">Scope</label>
          <select id="clip-scope">
            <option value="shared">shared (global)</option>
            <option value="agent:claude">agent:claude</option>
            <option value="agent:xibalba">agent:xibalba</option>
            <option value="agent:user">agent:user</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clip-epistemic">Class Override</label>
          <select id="clip-epistemic">
            <option value="auto">Auto-Classify</option>
            <option value="fact">Fact</option>
            <option value="hypothesis">Hypothesis</option>
            <option value="axiom">Axiom</option>
            <option value="belief">Belief</option>
            <option value="observation">Observation</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="clip-title">Title</label>
        <input type="text" id="clip-title" placeholder="Page Title">
      </div>

      <div class="form-group">
        <label for="clip-url">Source URL</label>
        <input type="text" id="clip-url" placeholder="https://..." readonly style="opacity: 0.8;">
      </div>

      <div class="form-group">
        <label for="clip-text">Memory Content / Selection</label>
        <textarea id="clip-text" placeholder="Selected text or memory note..."></textarea>
      </div>

      <button class="btn-primary" id="btn-clip">
        <span>⚡</span> ANCHOR MEMORY TO LEDGER
      </button>

      <button class="btn-secondary" id="btn-ingest-url">
        🌐 INGEST FULL PAGE VIA URL CONNECTOR
      </button>

      <div class="result-alert" id="clip-result"></div>
    </div>

    <!-- RECALL TAB -->
    <div id="view-recall" style="display: none;">
      <div class="form-group">
        <label for="recall-query">Semantic Knowledge Query</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="recall-query" placeholder="Ask memory ledger...">
          <button class="btn-primary" id="btn-recall-search" style="width: auto; padding: 0 12px;">🔍</button>
        </div>
      </div>
      <div id="recall-results" style="max-height: 240px; overflow-y: auto;">
        <div style="text-align: center; color: var(--text-muted); padding: 20px 0; font-family: var(--font-mono); font-size: 11px;">
          Enter a query to retrieve anchored memories.
        </div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="view-settings" style="display: none;">
      <div class="form-group">
        <label for="cfg-server-url">Super-Cortex Server API</label>
        <input type="text" id="cfg-server-url" value="http://127.0.0.1:4174">
      </div>
      <div class="form-group">
        <label for="cfg-agent-id">Default Agent ID</label>
        <input type="text" id="cfg-agent-id" value="agent:chrome-extension">
      </div>
      <button class="btn-primary" id="btn-save-settings">SAVE CONFIGURATION</button>
      <div class="result-alert" id="settings-result"></div>
    </div>
  </main>

  <footer>
    <a href="http://127.0.0.1:4174" target="_blank" id="link-studio">
      <span>OPEN STUDIO</span>
      <span>↗</span>
    </a>
    <span style="color: var(--text-muted);" id="footer-daemon">DAEMON: 127.0.0.1:6767</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
